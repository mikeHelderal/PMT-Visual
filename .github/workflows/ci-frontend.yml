name: Frontend CI-CD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `ci` plutôt que `install` : installation reproductible à partir du lock-file
      - name: Install dependencies
        run: npm ci

      # Jest applique le seuil de couverture de 60 % défini dans jest.config.js :
      # l'étape échoue si la couverture repasse en dessous.
      - name: Run tests with coverage
        run: npm run test:coverage -- --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: coverage/pmt-frontend/
          retention-days: 30

      - name: Build project
        run: npm run build -- --configuration production

      # Déploiement : uniquement sur push de branche. Une pull request
      # exécute les tests sans publier d'image.
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # `latest` pour le déploiement courant, le SHA pour pouvoir revenir en arrière
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pmt-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pmt-frontend:${{ github.sha }}

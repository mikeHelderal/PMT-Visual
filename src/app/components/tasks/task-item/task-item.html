  <td tuiTd>
    @if(!isEditing()){
      <span (click)="toggleEdit()" style="cursor: pointer">
      {{task().nom}}
    </span>

    } @else {
      <tui-textfield >
        <input
          tuiTextfield
          [value]="task().nom"
          #nameInput
          (blur)="saveName(nameInput.value)"
          (keydown.enter)="saveName(nameInput.value)"
          autoFocus
          size="s"
        />
      </tui-textfield>
    }
  </td>
  <td tuiTd>
    <button
      tuiBadge
      type="button"
      [appearance]="getPriorityAppearance(task().priorite)"
      (click)="changePriority()"
      style="cursor: pointer"
    >
      {{ task().priorite }}
    </button>
  </td>
  <td tuiTd>
    <button
      tuiBadge
      type="button"
      [appearance]="task().status === 'TERMINE' ? 'success' : (task().status === 'EN_COURS' ? 'warning' : 'neutral')"
      (click)="changeStatus()"
    >
      {{ task().status }}
    </button>
  </td>
  <td tuiTd>{{task().dateEcheance | date:'dd/MM/yyyy'}}</td>
  <td tuiTd> {{task().assignee ? task().assignee?.username : 'aucun'}} </td>
  <td tuiTd>
    @if(isadmin()){
      <button
        tuiIconButton
        appearance="flat"
        size="s"
        iconStart="@tui.trash"
        type="button"
        (click)="onDelete()"
        title="Supprimer la tâche"
      ></button>
    }

    <app-task-add-member
      [task]="task()!"
      [projectId]="projectId()"
      (memberAdded)="updateTask()"
    ></app-task-add-member>
  </td>

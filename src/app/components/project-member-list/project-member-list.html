<div class="tui-container">
  <div class="tui-row tui-row_s">
    <div class="tui-col_12">
      <h2 tuiTitle="l" class="tui-space_bottom-6">Membres du projet</h2>
    </div>
  </div>
  <div class="tui-row tui-row_s">
    <div class="tui-col_12">
      <app-project-member-invite [projectId]="projectId()" (memberAdded)="loadMembers()" ></app-project-member-invite>
    </div>
  </div>

  <tui-loader [overlay]="true" [showLoader]="isLoading()">
    <div class="tui-stack tui-stack_m">
      @for (member of members(); track member.id) {
        <div tuiCardLarge >
          <header tuiHeader>
            <tui-avatar
              size="m"
              [src]="member.username"
              class="tui-space_right-3"
            ></tui-avatar>

            <div tuiTitle>
              {{ member.username }}
              <div tuiSubtitle>
                <tui-badge appearance="neutral" size="m">
                  {{ member.role }}
                </tui-badge>
                <span class="tui-text_caption tui-space_left-2">
                  Inscrit le {{ member.dateArrivee | date : 'dd/MM/yyyy' }}
                </span>
              </div>
            </div>

            <button
              tuiButton
              type="button"
              appearance="secondary-destructive"
              size="s"
              iconStart="@tui.trash"
              (click)="deleteMember(member.id!)"
            >
              Retirer
            </button>
          </header>
        </div>
      } @empty {
        <div tuiCardLarge class="member-empty tui-text_body-m">
          Aucun membre trouvé pour ce projet.
        </div>
      }
    </div>
  </tui-loader>
</div>

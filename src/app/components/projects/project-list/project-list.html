<div class="project-page">

  <header class="project-page__header">
    <h1 class="tui-text_h3">Mes projets</h1>
    <p class="project-page__subtitle">Retrouve et gère tous tes projets</p>
  </header>

  <div class="project-page__actions">
    <button
      tuiButton
      appearance="primary"
      size="s"
      class="new-project-btn"
      (click)="showDialog(createModal)"
    >
      Nouveau projet
    </button>
  </div>

  <section class="project-page__content">
    @if (projects().length > 0) {
      <div class="project-grid">
        @for(item of projects(); track item.id) {
          <div class="project-grid__item">
            <app-project-card
              [project]="item"
              (onDelete)="deleteProject($event)"
            />
          </div>
        }
      </div>
    } @else {
      <div class="project-empty">
        <p class="tui-text_body-m">Vous n'avez pas encore de projet.</p>
      </div>
    }
  </section>

</div>

<ng-template #createModal let-observer>
  <form class="project-modal-form" (ngSubmit)="submitProject(observer)">

    <tui-textfield>
      <label tuiLabel>Nom du projet</label>
      <input tuiTextfield [(ngModel)]="newProject.nom" name="nom" required />
    </tui-textfield>

    <tui-textfield>
      <label tuiLabel>Description</label>
      <textarea tuiTextarea [(ngModel)]="newProject.description" name="description"></textarea>
    </tui-textfield>

    <div class="tui-form__buttons">
      <button tuiButton type="submit">Créer</button>

      <button
        tuiButton
        appearance="flat"
        type="button"
        (click)="observer.complete()"
      >
        Annuler
      </button>
    </div>

  </form>
</ng-template>

<div class="tui-island tui-space_top-6">
  <h3 class="tui-text_h6 tui-space_bottom-4"> Ajouter un membre à l'équipe</h3>

  <div class="tui-row tui-row_adaptive">
    <div class="tui-col_md-5">
      <tui-textfield>
        <label tuiLabel>Email du collaborateur</label>
        <input
          tuiTextfield
          type="email"
          placeholder="ex: dev@projet.com"
          [(ngModel)]="email"
        />
      </tui-textfield>
    </div>

    <div class="tui-col_md-4">
      <tui-textfield tuiChevron>
        <label tuiLabel>Attribuer un rôle</label>
        <input
          tuiSelect
          [(ngModel)]="role"
          placeholder="Choisir un rôle"
        />
        <tui-data-list-wrapper
          *tuiTextfieldDropdown
          [items]="roles"
        ></tui-data-list-wrapper>
      </tui-textfield>
    </div>

    <div class="tui-col_md-3" style="display: flex; align-items: center;">
      <button
        tuiButton
        type="button"
        appearance="primary"
        size="m"
        [disabled]="!email() || !role()"
        (click)="onAddMember()"
      >
        Ajouter
      </button>
    </div>
  </div>
</div>
